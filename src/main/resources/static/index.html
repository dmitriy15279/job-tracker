<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="page">
        <header>
            <h1>Job Tracker</h1>
            <p class="subtitle">Track your job applications</p>
        </header>

        <main>
            <section class="card">
                <h2>New application</h2>
                <form id="create-form">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required>

                    <label for="position">Position</label>
                    <input type="text" id="position" name="position" required>

                    <label for="appliedDate">Applied date</label>
                    <input type="date" id="appliedDate" name="appliedDate" required>

                    <button type="submit">Add application</button>
                </form>
                <div id="create-result" class="result" hidden></div>
            </section>

            <section class="card">
                <h2>Find by ID</h2>
                <form id="lookup-form">
                    <label for="lookup-id">Application ID</label>
                    <input type="number" id="lookup-id" name="id" min="1" required>
                    <button type="submit">Look up</button>
                </form>
                <div id="lookup-result" class="result" hidden></div>
            </section>

            <section class="card">
                <h2>All applications</h2>
                <button type="button" id="load-all-button">Load all applications</button>
                <div id="all-result" class="result" hidden></div>
                <ul id="all-list" class="recent-list"></ul>
            </section>

            <section class="card">
                <h2>Recently added</h2>
                <ul id="recent-list" class="recent-list">
                    <li class="empty">Nothing yet — add an application above.</li>
                </ul>
            </section>
        </main>
    </div>

    <script src="/app.js" defer></script>
</body>
</html>
