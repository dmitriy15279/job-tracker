spring:
  application:
    name: job-tracker
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    error:
      # Expose the reason (e.g. "appliedDate cannot be in the future") and field errors to clients such as the UI
      include-message: always
      include-binding-errors: always
  datasource:
    url: jdbc:postgresql://localhost:5433/job_tracker
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: job-tracker-messages
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.jobtracker.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  tomcat:
    max-swallow-size: 10MB

logging:
  level:
    root: INFO
    com.example.jobtracker: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG

referral:
  # Where referral codes live: redis (removed by Redis key TTL) | database (removed by the cleanup cron job)
  storage: ${REFERRAL_STORAGE:redis}
  ttl: ${REFERRAL_TTL:24h}
  code-length: 8
  # Only used with storage=database
  cleanup-cron: ${REFERRAL_CLEANUP_CRON:0 */5 * * * *}

avatar:
  max-dimension: 4096
  thumbnail-size: 256
  url-ttl: ${AVATAR_URL_TTL:15m}
  s3:
    endpoint: ${AVATAR_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${AVATAR_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: us-east-1
    access-key: ${AVATAR_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AVATAR_S3_SECRET_KEY:minioadmin}
    bucket: ${AVATAR_S3_BUCKET:avatars}
